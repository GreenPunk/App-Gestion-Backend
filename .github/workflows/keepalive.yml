# Mantiene despierto el backend de Render (plan free) en horario laboral.
# GitHub corre esto en horario UTC: 11:00-23:55 UTC = 08:00-20:55 hora Argentina.
# Subir este archivo al repo como: .github/workflows/keepalive.yml
name: keepalive

on:
  schedule:
    - cron: "*/5 11-23 * * *"
  workflow_dispatch: {}   # permite probarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping al backend
        # --max-time 90 cubre el arranque en frío (~1 min). "|| echo" evita que un
        # timeout puntual marque el job como fallido y mande mails de error.
        run: |
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 \
            https://app-gestion-backend-zhsr.onrender.com/health \
            || echo "Sin respuesta (el backend puede estar arrancando)"
